name: Build Windows only

# Manually started build of just the Windows x64 portable app.
# Reuses the repo's own pipeline: deps are built once and cached, then the app is built.
on:
  workflow_dispatch:
    inputs:
      build-deps-only:
        description: 'Only build dependencies (run this first if the full build times out)'
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build_windows:
    name: Build Windows x64
    uses: ./.github/workflows/build_check_cache.yml
    with:
      os: windows-latest
      build-deps-only: ${{ inputs.build-deps-only }}
    secrets: inherit
